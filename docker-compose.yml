services:
  pc_5:
    build: .
    container_name: PC_5
    hostname: PC_5
    cap_add: [NET_ADMIN]
    command: ["/opt/lab/pc-init.sh", "10.5.0.2", "10.5.0.1"]
    networks:
      lan5:
        ipv4_address: 10.5.0.2

  cmm_5:
    build: .
    container_name: CMM_5
    hostname: CMM_5
    privileged: true
    environment:
      APP_LANG: ${APP_LANG:-python}
      APP_F_PAYLOAD: ${APP_F_PAYLOAD:-1600}
    command: ["/opt/lab/cmm-init.sh", "5"]
    networks:
      lan5:
        ipv4_address: 10.5.0.1
      backbone:
        ipv4_address: 10.100.0.5

  cmm_6:
    build: .
    container_name: CMM_6
    hostname: CMM_6
    privileged: true
    environment:
      APP_LANG: ${APP_LANG:-python}
      APP_F_PAYLOAD: ${APP_F_PAYLOAD:-1600}
    command: ["/opt/lab/cmm-init.sh", "6"]
    networks:
      lan6:
        ipv4_address: 10.6.0.1
      backbone:
        ipv4_address: 10.100.0.6

  pc_6:
    build: .
    container_name: PC_6
    hostname: PC_6
    cap_add: [NET_ADMIN]
    command: ["/opt/lab/pc-init.sh", "10.6.0.2", "10.6.0.1"]
    networks:
      lan6:
        ipv4_address: 10.6.0.2

networks:
  lan5:
    name: docker_cmm_tunnel_lan5
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.5.0.0/24
          gateway: 10.5.0.254
  lan6:
    name: docker_cmm_tunnel_lan6
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.6.0.0/24
          gateway: 10.6.0.254
  backbone:
    name: docker_cmm_tunnel_backbone
    driver: bridge
    internal: true
    ipam:
      config: [{subnet: 10.100.0.0/24}]
